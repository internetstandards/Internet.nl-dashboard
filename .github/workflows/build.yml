name: QA and image building

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
      packages: write
      pull-requests: write
    environment: Default
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Support Matrix from python.org/downloads:
        # 3.7, 2023-06-27
        # 3.8, 2024-10
        # 3.9, 2025-10
        # 3.10 2026-10
        python-version: [ "3.10" ]
        redis-version: [ 6 ]
    steps:
      - uses: actions/checkout@v7
      # This helps with adding version information to the build in the admin on production. CI usually works shallow.
      # https://stackoverflow.com/questions/4916492/git-describe-fails-with-fatal-no-names-found-cannot-describe-anything
      # this will fetch the whole repository, which is more expensive.
      - run: git fetch --prune --unshallow --tags
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start Redis
        uses: supercharge/redis-github-action@1.5.0
        with:
          redis-version: ${{ matrix.redis-version }}
      - name: install uv
        run: pip install uv
      - name: setup
        run: make setup
      - name: qa
        run: |
          make check
          make bandit
          make vulture
      - name: test
        run: make test
      - name: build image
        run: |
          make image build_args="--build-arg=VERSION=$(git describe --tags --abbrev=0)-$(git log -1 --pretty=format:%h)"
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          make push_image
